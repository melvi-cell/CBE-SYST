<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Timetable | LearnPro</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <style>
        .glass-card { background: rgba(255,255,255,0.7); backdrop-filter: blur(20px); border-radius: 24px; border: 1px solid rgba(255,255,255,0.3); }
        .toast { position: fixed; bottom: 24px; right: 24px; background: #003f87; color: white; padding: 12px 24px; border-radius: 48px; z-index: 1000; font-weight: 600; }
        .toast-error { background: #dc2626; }
        .toast-success { background: #059669; }
    </style>
</head>
<body class="bg-[#f9f9ff] p-6">

    <div class="max-w-5xl mx-auto">
        <div class="flex justify-between items-center mb-6">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-gradient-to-br from-[#003f87] to-[#0056b3] rounded-xl flex items-center justify-center shadow-md">
                    <span class="material-symbols-outlined text-white">schedule</span>
                </div>
                <h1 class="text-2xl font-bold text-[#003f87]">Academic Timetable</h1>
            </div>
            <div class="flex gap-3">
                <button onclick="goToDashboard()" class="px-4 py-2 border border-[#003f87] text-[#003f87] rounded-xl hover:bg-[#003f87]/5 transition">Dashboard</button>
                <button onclick="logout()" class="px-4 py-2 bg-red-600 text-white rounded-xl hover:bg-red-700 transition">Logout</button>
            </div>
        </div>

        <div class="glass-card p-6">
            <form id="lessonForm" class="grid grid-cols-1 md:grid-cols-5 gap-4 mb-6">
                <input id="className" type="text" placeholder="Class (e.g., Grade 4A)" class="p-3 border rounded-xl focus:border-[#003f87] focus:ring-2 focus:ring-[#003f87]/20" required>
                <input id="subject" type="text" placeholder="Subject" class="p-3 border rounded-xl focus:border-[#003f87] focus:ring-2 focus:ring-[#003f87]/20" required>
                <input id="teacher" type="text" placeholder="Teacher Name" class="p-3 border rounded-xl focus:border-[#003f87] focus:ring-2 focus:ring-[#003f87]/20" required>
                <input id="time" type="text" placeholder="Time (e.g., 08:00 AM)" class="p-3 border rounded-xl focus:border-[#003f87] focus:ring-2 focus:ring-[#003f87]/20" required>
                <input id="day" type="text" placeholder="Day (e.g., Monday)" class="p-3 border rounded-xl focus:border-[#003f87] focus:ring-2 focus:ring-[#003f87]/20" required>
                <button type="submit" class="md:col-span-5 bg-gradient-to-r from-[#003f87] to-[#0056b3] text-white font-semibold rounded-xl py-3 hover:shadow-lg transition">Add Lesson</button>
            </form>
            
            <h2 class="text-xl font-bold text-[#003f87] mb-4">Timetable</h2>
            <div id="timetableList" class="space-y-2 max-h-96 overflow-y-auto">
                <div class="text-center text-gray-400 py-8">Loading timetable...</div>
            </div>
        </div>
    </div>

    <div id="toast" style="display:none" class="toast"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA4cm7chJXz90yOLWPtbdIW8KlEozG1lxo",
            authDomain: "learnpro-kenya-erp.firebaseapp.com",
            projectId: "learnpro-kenya-erp",
            storageBucket: "learnpro-kenya-erp.firebasestorage.app",
            messagingSenderId: "327168081514",
            appId: "1:327168081514:web:13cdc8b827fa76d95a9413"
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        let currentSchoolCode = null;

        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = `toast ${isError ? 'toast-error' : 'toast-success'}`;
            toast.style.display = 'block';
            setTimeout(() => toast.style.display = 'none', 3000);
        }

        function goToDashboard() {
            window.location.href = 'dashboard.html';
        }

        async function logout() {
            await auth.signOut();
            sessionStorage.clear();
            window.location.href = 'index.html';
        }

        async function loadTimetable() {
            if (!currentSchoolCode) return;
            try {
                const snap = await db.collection('schools').doc(currentSchoolCode).collection('timetable').get();
                let html = '';
                if (snap.empty) {
                    html = '<div class="text-center text-gray-400 py-8">No lessons scheduled</div>';
                } else {
                    snap.forEach(doc => {
                        const t = doc.data();
                        html += `
                            <div class="p-3 bg-white rounded-xl flex justify-between items-center">
                                <div>
                                    <p class="font-semibold text-gray-800">${t.className || 'N/A'} - ${t.subject || 'N/A'}</p>
                                    <p class="text-xs text-gray-500">Teacher: ${t.teacher || 'N/A'} | ${t.day || ''} ${t.time || ''}</p>
                                </div>
                                <button onclick="deleteLesson('${doc.id}')" class="text-red-500 hover:text-red-700">
                                    <span class="material-symbols-outlined text-sm">delete</span>
                                </button>
                            </div>
                        `;
                    });
                }
                document.getElementById('timetableList').innerHTML = html;
            } catch (error) {
                console.error(error);
                document.getElementById('timetableList').innerHTML = '<div class="text-center text-gray-400 py-8">Error loading timetable</div>';
            }
        }

        window.deleteLesson = async (id) => {
            if (!currentSchoolCode) return;
            if (confirm('Delete this lesson?')) {
                await db.collection('schools').doc(currentSchoolCode).collection('timetable').doc(id).delete();
                showToast('Lesson deleted');
                await loadTimetable();
            }
        };

        document.getElementById('lessonForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentSchoolCode) {
                showToast('School not loaded', true);
                return;
            }

            const className = document.getElementById('className').value.trim();
            const subject = document.getElementById('subject').value.trim();
            const teacher = document.getElementById('teacher').value.trim();
            const time = document.getElementById('time').value.trim();
            const day = document.getElementById('day').value.trim();

            if (!className || !subject || !teacher) {
                showToast('Please fill required fields', true);
                return;
            }

            const btn = e.target.querySelector('button');
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = 'Adding...';

            try {
                await db.collection('schools').doc(currentSchoolCode).collection('timetable').add({
                    className: className,
                    subject: subject,
                    teacher: teacher,
                    time: time,
                    day: day,
                    createdAt: new Date().toISOString()
                });
                showToast('Lesson added successfully!');
                document.getElementById('lessonForm').reset();
                await loadTimetable();
            } catch (error) {
                console.error(error);
                showToast('Error adding lesson', true);
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        });

        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = 'index.html';
                return;
            }

            try {
                currentSchoolCode = sessionStorage.getItem('currentSchoolCode');
                if (!currentSchoolCode) {
                    const schoolsSnap = await db.collection('schools').where('adminId', '==', user.uid).get();
                    if (!schoolsSnap.empty) {
                        currentSchoolCode = schoolsSnap.docs[0].id;
                        sessionStorage.setItem('currentSchoolCode', currentSchoolCode);
                    }
                }
                await loadTimetable();
            } catch (error) {
                console.error(error);
            }
        });
    </script>
</body>
</html>
