<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBC Analytics | LearnPro</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <style>
        .glass-card { background: rgba(255,255,255,0.7); backdrop-filter: blur(20px); border-radius: 24px; border: 1px solid rgba(255,255,255,0.3); }
        .toast { position: fixed; bottom: 24px; right: 24px; background: #003f87; color: white; padding: 12px 24px; border-radius: 48px; z-index: 1000; font-weight: 600; }
        .toast-error { background: #dc2626; }
        .toast-success { background: #059669; }
    </style>
</head>
<body class="bg-[#f9f9ff] p-6">

    <div class="max-w-6xl mx-auto">
        <div class="flex justify-between items-center mb-6">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-gradient-to-br from-[#003f87] to-[#0056b3] rounded-xl flex items-center justify-center shadow-md">
                    <span class="material-symbols-outlined text-white">analytics</span>
                </div>
                <h1 class="text-2xl font-bold text-[#003f87]">CBC Performance Analytics</h1>
            </div>
            <div class="flex gap-3">
                <button onclick="goToDashboard()" class="px-4 py-2 border border-[#003f87] text-[#003f87] rounded-xl hover:bg-[#003f87]/5 transition">Dashboard</button>
                <button onclick="logout()" class="px-4 py-2 bg-red-600 text-white rounded-xl hover:bg-red-700 transition">Logout</button>
            </div>
        </div>

        <div class="grid md:grid-cols-3 gap-6 mb-8">
            <div class="glass-card p-6 text-center">
                <div class="text-4xl font-bold text-[#003f87]" id="eeCount">0</div>
                <p class="text-gray-600 mt-2">Exceeding Expectations (EE)</p>
            </div>
            <div class="glass-card p-6 text-center">
                <div class="text-4xl font-bold text-[#006d40]" id="meCount">0</div>
                <p class="text-gray-600 mt-2">Meeting Expectations (ME)</p>
            </div>
            <div class="glass-card p-6 text-center">
                <div class="text-4xl font-bold text-[#583d00]" id="aeCount">0</div>
                <p class="text-gray-600 mt-2">Approaching Expectations (AE)</p>
            </div>
        </div>

        <div class="glass-card p-6">
            <h2 class="text-xl font-bold text-[#003f87] mb-4">Subject Performance</h2>
            <div id="subjectList" class="space-y-3 max-h-96 overflow-y-auto">
                <div class="text-center text-gray-400 py-8">Loading analytics...</div>
            </div>
        </div>

        <div class="glass-card p-6 mt-6">
            <h2 class="text-xl font-bold text-[#003f87] mb-4">Record Assessment</h2>
            <form id="assessmentForm" class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <input id="studentName" type="text" placeholder="Student Name" class="p-3 border rounded-xl" required>
                <input id="subjectName" type="text" placeholder="Subject" class="p-3 border rounded-xl" required>
                <select id="gradeLevel" class="p-3 border rounded-xl" required>
                    <option value="">Select Grade</option>
                    <option value="EE">EE - Exceeding Expectations</option>
                    <option value="ME">ME - Meeting Expectations</option>
                    <option value="AE">AE - Approaching Expectations</option>
                    <option value="BE">BE - Below Expectations</option>
                </select>
                <button type="submit" class="bg-gradient-to-r from-[#003f87] to-[#0056b3] text-white font-semibold rounded-xl py-3">Record Assessment</button>
            </form>
        </div>
    </div>

    <div id="toast" style="display:none" class="toast"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA4cm7chJXz90yOLWPtbdIW8KlEozG1lxo",
            authDomain: "learnpro-kenya-erp.firebaseapp.com",
            projectId: "learnpro-kenya-erp",
            storageBucket: "learnpro-kenya-erp.firebasestorage.app",
            messagingSenderId: "327168081514",
            appId: "1:327168081514:web:13cdc8b827fa76d95a9413"
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        let currentSchoolCode = null;

        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = `toast ${isError ? 'toast-error' : 'toast-success'}`;
            toast.style.display = 'block';
            setTimeout(() => toast.style.display = 'none', 3000);
        }

        function goToDashboard() {
            window.location.href = 'dashboard.html';
        }

        async function logout() {
            await auth.signOut();
            sessionStorage.clear();
            window.location.href = 'index.html';
        }

        async function loadAnalytics() {
            if (!currentSchoolCode) return;
            try {
                const assessments = await db.collection('schools').doc(currentSchoolCode).collection('assessments').get();
                let ee = 0, me = 0, ae = 0;
                const subs = {};
                
                assessments.forEach(doc => {
                    const data = doc.data();
                    const grade = data.grade;
                    const subject = data.subject;
                    
                    if (grade === 'EE') ee++;
                    else if (grade === 'ME') me++;
                    else if (grade === 'AE') ae++;
                    
                    if (subject) {
                        if (!subs[subject]) subs[subject] = { ee: 0, me: 0, ae: 0 };
                        if (grade === 'EE') subs[subject].ee++;
                        else if (grade === 'ME') subs[subject].me++;
                        else if (grade === 'AE') subs[subject].ae++;
                    }
                });
                
                document.getElementById('eeCount').innerText = ee;
                document.getElementById('meCount').innerText = me;
                document.getElementById('aeCount').innerText = ae;
                
                let html = '';
                for (let s in subs) {
                    html += `
                        <div class="p-3 bg-white rounded-xl flex justify-between items-center">
                            <span class="font-semibold">${s}</span>
                            <div class="flex gap-3 text-xs">
                                <span class="text-[#003f87]">EE: ${subs[s].ee}</span>
                                <span class="text-[#006d40]">ME: ${subs[s].me}</span>
                                <span class="text-[#583d00]">AE: ${subs[s].ae}</span>
                            </div>
                        </div>
                    `;
                }
                document.getElementById('subjectList').innerHTML = html || '<div class="text-center text-gray-400 py-8">No assessments recorded yet</div>';
                
            } catch (error) {
                console.error(error);
            }
        }

        document.getElementById('assessmentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentSchoolCode) {
                showToast('School not loaded', true);
                return;
            }

            const studentName = document.getElementById('studentName').value.trim();
            const subject = document.getElementById('subjectName').value.trim();
            const grade = document.getElementById('gradeLevel').value;

            if (!studentName || !subject || !grade) {
                showToast('Please fill all fields', true);
                return;
            }

            const btn = e.target.querySelector('button');
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = 'Recording...';

            try {
                await db.collection('schools').doc(currentSchoolCode).collection('assessments').add({
                    studentName: studentName,
                    subject: subject,
                    grade: grade,
                    date: new Date().toISOString()
                });
                showToast('Assessment recorded successfully!');
                document.getElementById('assessmentForm').reset();
                await loadAnalytics();
            } catch (error) {
                console.error(error);
                showToast('Error recording assessment', true);
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        });

        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = 'index.html';
                return;
            }

            try {
                currentSchoolCode = sessionStorage.getItem('currentSchoolCode');
                if (!currentSchoolCode) {
                    const schoolsSnap = await db.collection('schools').where('adminId', '==', user.uid).get();
                    if (!schoolsSnap.empty) {
                        currentSchoolCode = schoolsSnap.docs[0].id;
                        sessionStorage.setItem('currentSchoolCode', currentSchoolCode);
                    }
                }
                await loadAnalytics();
            } catch (error) {
                console.error(error);
            }
        });
    </script>
</body>
</html>
