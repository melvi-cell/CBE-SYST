<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KNEC Registration | LearnPro</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <style>
        .glass-card { background: rgba(255,255,255,0.7); backdrop-filter: blur(20px); border-radius: 24px; border: 1px solid rgba(255,255,255,0.3); }
        .toast { position: fixed; bottom: 24px; right: 24px; background: #003f87; color: white; padding: 12px 24px; border-radius: 48px; z-index: 1000; font-weight: 600; }
        .toast-error { background: #dc2626; }
        .toast-success { background: #059669; }
    </style>
</head>
<body class="bg-[#f9f9ff]">

    <header class="bg-white shadow-sm p-4 flex justify-between items-center px-6">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-gradient-to-br from-[#003f87] to-[#0056b3] rounded-xl flex items-center justify-center shadow-md">
                <span class="material-symbols-outlined text-white">how_to_reg</span>
            </div>
            <h1 class="text-2xl font-bold text-[#003f87]">KNEC Exam Portal</h1>
        </div>
        <div class="flex gap-3">
            <button onclick="goToDashboard()" class="px-4 py-2 border border-[#003f87] text-[#003f87] rounded-xl hover:bg-[#003f87]/5 transition">Dashboard</button>
            <button onclick="logout()" class="px-4 py-2 bg-red-600 text-white rounded-xl hover:bg-red-700 transition">Logout</button>
        </div>
    </header>

    <div class="max-w-4xl mx-auto p-6">
        <form id="regForm" class="space-y-6">
            <div class="glass-card p-6">
                <h3 class="text-xl font-bold text-[#003f87] mb-4">Personal Details</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input id="fullName" type="text" placeholder="Full Name" class="p-3 border rounded-xl focus:border-[#003f87] focus:ring-2 focus:ring-[#003f87]/20" required>
                    <input id="admNo" type="text" placeholder="Admission Number" class="p-3 border rounded-xl focus:border-[#003f87] focus:ring-2 focus:ring-[#003f87]/20" required>
                    <input id="upi" type="text" placeholder="UPI Number (NEMIS)" class="p-3 border rounded-xl focus:border-[#003f87] focus:ring-2 focus:ring-[#003f87]/20" required>
                    <input id="dob" type="date" placeholder="Date of Birth" class="p-3 border rounded-xl focus:border-[#003f87] focus:ring-2 focus:ring-[#003f87]/20" required>
                    <select id="gender" class="p-3 border rounded-xl focus:border-[#003f87] focus:ring-2 focus:ring-[#003f87]/20" required>
                        <option value="">Select Gender</option>
                        <option>Male</option>
                        <option>Female</option>
                    </select>
                    <select id="disability" class="p-3 border rounded-xl focus:border-[#003f87] focus:ring-2 focus:ring-[#003f87]/20">
                        <option value="None">No Disability</option>
                        <option>Visual Impairment</option>
                        <option>Hearing Impairment</option>
                        <option>Physical Disability</option>
                    </select>
                </div>
            </div>

            <div class="glass-card p-6">
                <h3 class="text-xl font-bold text-[#003f87] mb-4">Subjects (KEPSEA)</h3>
                <div class="grid grid-cols-2 gap-3">
                    <label class="flex items-center gap-2"><input type="checkbox" value="Mathematics" checked class="w-4 h-4"> Mathematics</label>
                    <label class="flex items-center gap-2"><input type="checkbox" value="English" checked class="w-4 h-4"> English</label>
                    <label class="flex items-center gap-2"><input type="checkbox" value="Kiswahili" class="w-4 h-4"> Kiswahili</label>
                    <label class="flex items-center gap-2"><input type="checkbox" value="Science" class="w-4 h-4"> Integrated Science</label>
                    <label class="flex items-center gap-2"><input type="checkbox" value="Social Studies" class="w-4 h-4"> Social Studies</label>
                    <label class="flex items-center gap-2"><input type="checkbox" value="Creative Arts" class="w-4 h-4"> Creative Arts</label>
                </div>
            </div>

            <div class="glass-card p-6">
                <h3 class="text-xl font-bold text-[#003f87] mb-4">Verification Checklist</h3>
                <label class="flex items-center gap-2 mb-3"><input type="checkbox" id="verifyCert" class="w-4 h-4"> I confirm the birth certificate has been reviewed</label>
                <label class="flex items-center gap-2"><input type="checkbox" id="verifyUpi" class="w-4 h-4"> UPI verified with NEMIS records</label>
            </div>

            <button type="submit" class="w-full py-3 bg-gradient-to-r from-[#003f87] to-[#0056b3] text-white font-semibold rounded-xl hover:shadow-lg transition">Submit to KNEC</button>
        </form>
    </div>

    <div id="toast" style="display:none" class="toast"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA4cm7chJXz90yOLWPtbdIW8KlEozG1lxo",
            authDomain: "learnpro-kenya-erp.firebaseapp.com",
            projectId: "learnpro-kenya-erp",
            storageBucket: "learnpro-kenya-erp.firebasestorage.app",
            messagingSenderId: "327168081514",
            appId: "1:327168081514:web:13cdc8b827fa76d95a9413"
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        let currentSchoolCode = null;

        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = `toast ${isError ? 'toast-error' : 'toast-success'}`;
            toast.style.display = 'block';
            setTimeout(() => toast.style.display = 'none', 3000);
        }

        function goToDashboard() {
            window.location.href = 'dashboard.html';
        }

        async function logout() {
            await auth.signOut();
            sessionStorage.clear();
            window.location.href = 'index.html';
        }

        document.getElementById('regForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (!currentSchoolCode) {
                showToast('School not loaded. Please login again.', true);
                window.location.href = 'index.html';
                return;
            }
            
            if (!document.getElementById('verifyCert').checked || !document.getElementById('verifyUpi').checked) {
                showToast('Please verify all checklist items', true);
                return;
            }

            // Get selected subjects
            const subjects = [];
            document.querySelectorAll('#regForm input[type="checkbox"]:checked').forEach(cb => {
                if (cb.id !== 'verifyCert' && cb.id !== 'verifyUpi') {
                    subjects.push(cb.value);
                }
            });

            const data = {
                name: document.getElementById('fullName').value.trim(),
                admNo: document.getElementById('admNo').value.trim(),
                upi: document.getElementById('upi').value.trim(),
                dob: document.getElementById('dob').value,
                gender: document.getElementById('gender').value,
                disability: document.getElementById('disability').value,
                subjects: subjects,
                status: 'pending',
                registeredAt: new Date().toISOString()
            };

            const btn = e.target.querySelector('button');
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = 'Submitting...';

            try {
                await db.collection('schools').doc(currentSchoolCode).collection('registrations').add(data);
                showToast('Registration submitted successfully to KNEC!');
                document.getElementById('regForm').reset();
            } catch (error) {
                console.error(error);
                showToast('Error submitting registration', true);
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        });

        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = 'index.html';
                return;
            }

            try {
                currentSchoolCode = sessionStorage.getItem('currentSchoolCode');
                if (!currentSchoolCode) {
                    const schoolsSnap = await db.collection('schools').where('adminId', '==', user.uid).get();
                    if (!schoolsSnap.empty) {
                        currentSchoolCode = schoolsSnap.docs[0].id;
                        sessionStorage.setItem('currentSchoolCode', currentSchoolCode);
                    }
                }
            } catch (error) {
                console.error(error);
            }
        });
    </script>
</body>
</html>
